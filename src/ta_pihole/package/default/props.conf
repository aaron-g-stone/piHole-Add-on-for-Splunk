# ta_pihole sourcetypes

[pihole:stats:metrics]
# Log-to-metrics: each event is a single {"metric_name":..., "value":..., "account":...}
# JSON record. INDEXED_EXTRACTIONS=json performs the index-time field extraction that
# METRIC-SCHEMA-TRANSFORMS then converts into a metrics-index measurement.
INDEXED_EXTRACTIONS = json
METRIC-SCHEMA-TRANSFORMS = metric-schema:pihole_stats_metrics
SHOULD_LINEMERGE = false
TRUNCATE = 0

[pihole:dns:query]
SHOULD_LINEMERGE = false
LINE_BREAKER = ([\r\n]+)
TRUNCATE = 0
KV_MODE = json
# Event timestamp is set explicitly by the modular input from Pi-hole's own
# query "time" field; no TIME_ extraction needed here.
# Common Information Model (Network Resolution) alignment - keep the original
# Pi-hole field names and add CIM aliases rather than renaming at the source.
FIELDALIAS-cim = domain AS query, client_ip AS src, type AS record_type, upstream AS dest

[pihole:stats:top_domains]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json

[pihole:stats:top_clients]
SHOULD_LINEMERGE = false
TRUNCATE = 0
KV_MODE = json
FIELDALIAS-cim = ip AS src
